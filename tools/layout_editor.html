tructuredClone(initial);const byId=new Map(cards.map(c=>[c.id,c]));const grid=document.getElementById('grid'),pool=document.getElementById('pool');function save(){localStorage.setItem('gcg_admin_layout',JSON.stringify(slots))}function render(){grid.innerHTML=slots.map((id,i)=>{if(!id)return `<div class="slot empty" data-slot="${i}"></div>`;const c=byId.get(id);return `<div class="slot" data-slot="${i}"><div class="card" draggable="true" data-card="${c.id}" data-slot="${i}"><span class="rarity">${c.rarity}</span><span class="code">${c.code}</span><div class="name">${c.name}</div><div class="set">${c.set}</div></div></div>`}).join('');document.querySelectorAll('.card').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.slot)));document.querySelectorAll('.slot').forEach(el=>{el.addEventListener('dragover',e=>{if(slots[+el.dataset.slot])return;e.preventDefault();el.classList.add('drop')});el.addEventListener('dragleave',()=>el.classList.remove('drop'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop');const src=+e.dataTransfer.getData('text/plain'),dst=+el.dataset.slot;if(slots[dst]||!slots[src]||src===dst)return;slots[dst]=slots[src];slots[src]=null;save();render()})});const used=new Set(slots.filter(Boolean));const missing=cards.filter(c=>!used.has(c.id));pool.innerHTML=missing.length?missing.map(c=>`<button type="button" data-add="${c.id}">＋ ${c.code} ${c.name}</button>`).join(''):'なし';pool.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=slots.indexOf(null);if(i<0)return alert('空きマスがありません');slots[i]=b.dataset.add;save();render()})}document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify(slots,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('reset').onclick=()=>{slots=structuredClone(initial);save();render()};render();</script></body></html>
